<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Cozinha - Merenda</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card admin-card">
    <h2> Painel da Cozinha / Merendeira</h2>
    <p>Acompanhamento de refeições em tempo real</p>

    <div class="counter-box">
      <h3>Total de Almoços Solicitados</h3>
      <div id="totalCount" class="counter-number">0</div>
    </div>

    <h3>Lista de Pedidos Confirmados:</h3>
    <ul id="orderList" class="order-list"></ul>

    <button id="resetBtn" class="btn-danger">Zerar Pedidos do Dia</button>
  </div>

  <script>
    // Configurações do Supabase
    const SUPABASE_URL = 'https://jkfwiwwuntknukzwvqsu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uISqxRHPyqk0qw2jrEDASQ_ErG9qExw';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const totalCountEl = document.getElementById('totalCount');
    const orderListEl = document.getElementById('orderList');
    const resetBtn = document.getElementById('resetBtn');

    // Função para buscar e renderizar a lista de pedidos atualizada
    async function fetchOrders() {
      const { data: pedidos, error } = await supabaseClient
        .from('pedidos')
        .select('*')
        .order('criado_em', { ascending: false });

      if (error) return;

      totalCountEl.innerText = pedidos.length;
      orderListEl.innerHTML = '';

      if (pedidos.length === 0) {
        orderListEl.innerHTML = '<li class="empty-msg">Nenhum pedido realizado ainda.</li>';
        return;
      }

      pedidos.forEach(pedido => {
        const hora = new Date(pedido.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        const li = document.createElement('li');
        li.innerHTML = `<strong>${pedido.nome}</strong> (${pedido.turma}) — <small>${hora}</small>`;
        orderListEl.appendChild(li);
      });
    }

    // Configura o escutador em TEMPO REAL
    supabaseClient
      .channel('pedidos-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, () => {
        fetchOrders();
      })
      .subscribe();

    // Limpar pedidos durante testes
    resetBtn.addEventListener('click', async () => {
      if (confirm('Deseja zerar a lista de pedidos de hoje?')) {
        await supabaseClient.from('pedidos').delete().neq('id', 0);
        fetchOrders();
      }
    });

    // Busca inicial ao carregar a página
    fetchOrders();
  </script>
</body>
</html>
